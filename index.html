<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>הכסף שלי</title>
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הכסף שלי">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* ---------- palette roles (light) + dark below ---------- */
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,.10);
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
  --good-text: #006300;
  --accent: #2a78d6;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300;
  --ring-track: #e1e0d9;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,.10);
    --good-text: #0ca30c;
    --accent: #3987e5;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300;
    --ring-track: #2c2c2a;
  }
}
/* explicit theme toggle (e.g. claude.ai artifact viewer) wins both ways */
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,.10);
  --good-text: #0ca30c;
  --accent: #3987e5;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300;
  --ring-track: #2c2c2a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  direction: rtl; /* keeps RTL even when served without the <html dir> wrapper */
  background: var(--page); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px; line-height: 1.5;
  padding-bottom: calc(64px + env(safe-area-inset-bottom));
  max-width: 560px; margin: 0 auto;
}
h1,h2,h3 { margin: 0; }
button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
input, select { font: inherit; color: var(--ink); background: var(--page);
  border: 1px solid var(--baseline); border-radius: 10px; padding: 9px 12px; max-width: 100%; }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.num { font-variant-numeric: tabular-nums; }

.screen { display: none; padding: 12px 14px 20px; }
.screen.active { display: block; }
.card { background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 14px 16px; margin: 10px 0; }
.mut { color: var(--muted); font-size: 13px; }
.sub { color: var(--ink-2); font-size: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.spread { justify-content: space-between; }

/* ---------- top status / budget ring ---------- */
.status-card { display: flex; align-items: center; gap: 16px; }
.ring-wrap { position: relative; width: 108px; height: 108px; flex: none; }
.ring-wrap svg { transform: rotate(-90deg); }
.ring-val { position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; }
.ring-val .amt { font-size: 21px; font-weight: 800; }
.ring-val .lbl { font-size: 10.5px; color: var(--muted); margin-top: -3px; }
.status-main { flex: 1; min-width: 0; }
.status-title { font-size: 16px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
.status-note { margin-top: 2px; }

/* ---------- report screen ---------- */
.amount-display {
  text-align: center; font-size: 52px; font-weight: 800; letter-spacing: 1px;
  padding: 6px 0 2px; min-height: 70px;
}
.amount-display .cur { font-size: 30px; color: var(--muted); font-weight: 600; }
.amount-display.zero { color: var(--baseline); }
.type-toggle { display: flex; background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; padding: 3px; width: fit-content; margin: 0 auto 6px; }
.type-toggle button { padding: 5px 18px; border-radius: 999px; font-size: 13.5px;
  font-weight: 600; color: var(--ink-2); }
.type-toggle button.on { background: var(--accent); color: #fff; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0;
  direction: ltr; /* dialer-style 1-2-3 left-to-right */ }
.keypad button {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  font-size: 26px; font-weight: 600; padding: 13px 0;
}
.keypad button:active { background: var(--grid); }
.note-row input { width: 100%; }
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.cat-btn {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 10px 4px; text-align: center; font-size: 13px; font-weight: 600;
  display: flex; flex-direction: column; gap: 2px; align-items: center;
}
.cat-btn .em { font-size: 22px; }
.cat-btn:active { background: var(--grid); }
.save-income {
  width: 100%; background: var(--accent); color: #fff; font-weight: 700;
  border-radius: 14px; padding: 14px 0; font-size: 17px; margin-top: 10px;
}
.hint { text-align: center; margin-top: 8px; }

/* ---------- lists ---------- */
.tx-item { display: flex; align-items: center; gap: 10px; padding: 9px 2px;
  border-top: 1px solid var(--grid); }
.tx-item:first-child { border-top: none; }
.tx-emoji { font-size: 20px; flex: none; width: 28px; text-align: center; }
.tx-main { flex: 1; min-width: 0; }
.tx-name { font-size: 14.5px; font-weight: 600; }
.tx-time { font-size: 12px; color: var(--muted); }
.tx-amt { font-weight: 700; font-size: 15.5px; direction: ltr; unicode-bidi: isolate; }
.tx-amt.in { color: var(--good-text); }

/* ---------- weekend history ---------- */
.wk-card { padding: 11px 14px; }
.wk-head { display: flex; justify-content: space-between; align-items: baseline; }
.wk-title { font-weight: 700; font-size: 14.5px; }
.meter { height: 8px; border-radius: 4px; background: var(--ring-track);
  margin: 8px 0 4px; overflow: hidden; direction: ltr; }
.meter > div { height: 100%; border-radius: 4px; }
.badge { font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 999px;
  border: 1px solid var(--border); }
.badge.ok { color: var(--good-text); }
.badge.over { color: var(--crit); }

/* ---------- month ---------- */
.month-nav { display: flex; align-items: center; justify-content: space-between; margin: 4px 0; }
.month-nav button { font-size: 22px; padding: 4px 14px; color: var(--ink-2); }
.month-nav .cur-month { font-weight: 700; font-size: 16.5px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 10px 12px; text-align: center; }
.kpi .v { font-size: 19px; font-weight: 800; }
.kpi .l { font-size: 12px; color: var(--muted); }
.kpi .v.pos { color: var(--good-text); }
.kpi .v.neg { color: var(--crit); }
.bar-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.bar-label { width: 108px; flex: none; font-size: 13.5px; display: flex; gap: 6px; align-items: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-track { flex: 1; height: 14px; background: none; direction: ltr; display: flex; justify-content: flex-end; }
.bar-fill { height: 100%; border-radius: 4px 0 0 4px; min-width: 2px; }
.bar-amt { width: 64px; flex: none; text-align: left; font-size: 13px; font-weight: 600; direction: ltr; }

/* ---------- settings ---------- */
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 10px 0; border-top: 1px solid var(--grid); }
.set-row:first-child { border-top: none; }
.set-row label { font-size: 14.5px; }
.set-row input[type=number] { width: 90px; text-align: center; }
.btn { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 9px 16px; font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--crit); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  display: flex; background: var(--surface); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom); max-width: 560px; margin: 0 auto;
}
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 1px; padding: 8px 0 6px; font-size: 11px; color: var(--muted); font-weight: 600; }
.tabbar button .ic { font-size: 21px; }
.tabbar button.on { color: var(--accent); }

/* ---------- toast / modal ---------- */
.toast {
  position: fixed; bottom: calc(76px + env(safe-area-inset-bottom)); left: 14px; right: 14px;
  max-width: 532px; margin: 0 auto; z-index: 40;
  background: var(--ink); color: var(--page); border-radius: 14px; padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-size: 14.5px; font-weight: 600;
  transform: translateY(20px); opacity: 0; pointer-events: none; transition: .18s;
}
.toast.show { transform: none; opacity: 1; pointer-events: auto; }
.toast button { color: var(--warn); font-weight: 800; font-size: 14.5px; flex: none; }
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30;
  display: none; align-items: flex-end; justify-content: center; }
.modal-back.show { display: flex; }
.modal { background: var(--page); width: 100%; max-width: 560px;
  border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
.modal h3 { margin-bottom: 10px; }
.modal .field { margin: 10px 0; }
.modal .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 3px; }
.modal .field input, .modal .field select { width: 100%; }
.empty { text-align: center; color: var(--muted); padding: 22px 0; font-size: 14px; }
.insight-line { display: flex; gap: 8px; padding: 5px 0; font-size: 14.5px; align-items: baseline; }
.insight-line .em { flex: none; }
</style>
</head>
<body>

<!-- ================= REPORT ================= -->
<section id="s-report" class="screen active">
  <div class="card status-card" id="status-card"></div>
  <div class="type-toggle" id="type-toggle">
    <button data-type="expense" class="on">הוצאה</button>
    <button data-type="income">הכנסה</button>
  </div>
  <div class="amount-display zero" id="amount-display"><span class="cur">₪</span>0</div>
  <div class="keypad" id="keypad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k=".">.</button><button data-k="0">0</button><button data-k="del">⌫</button>
  </div>
  <div class="note-row"><input id="note-input" placeholder="הערה (אופציונלי)" autocomplete="off"></div>

  <p class="hint mut" id="report-hint">מקלידים סכום → נוגעים בקטגוריה → נשמר</p>
</section>

<!-- ================= WEEKEND ================= -->
<section id="s-weekend" class="screen">
  <h2 style="font-size:19px;margin:6px 2px">סופי שבוע</h2>
  <div class="card" id="wk-current"></div>
  <div class="card" id="wk-insights"></div>
  <h3 style="font-size:15px;margin:14px 2px 4px">היסטוריית סופ"שים</h3>
  <div id="wk-history"></div>
</section>

<!-- ================= MONTH ================= -->
<section id="s-month" class="screen">
  <div class="month-nav">
    <button id="m-prev">‹</button>
    <div class="cur-month" id="m-label"></div>
    <button id="m-next">›</button>
  </div>
  <div class="kpis" id="m-kpis"></div>
  <div class="card" id="m-weekend-share"></div>
  <div class="card">
    <h3 style="font-size:15px">לאן הלך הכסף</h3>
    <div id="m-cats"></div>
  </div>
  <div class="card">
    <div class="row spread">
      <h3 style="font-size:15px">קבועות חודשיות</h3>
      <button class="btn" id="fixed-add">+ הוספה</button>
    </div>
    <p class="mut" style="margin:2px 0 4px">משכורת, שכ"ד, מנויים - נספרות אוטומטית בכל חודש</p>
    <div id="fixed-list"></div>
  </div>
  <div class="card">
    <h3 style="font-size:15px">כל התנועות של החודש</h3>
    <div id="m-tx"></div>

</section>

<!-- ================= SETTINGS ================= -->
<section id="s-settings" class="screen">
  <h2 style="font-size:19px;margin:6px 2px">הגדרות</h2>
  <div class="card">
    <div class="set-row">
      <label>תקציב סופ"ש (₪)</label>
      <input type="number" id="set-budget" min="0" inputmode="numeric">
    </div>
    <div class="set-row">
      <label>תחילת הסופ"ש</label>
      <span class="row">
        <select id="set-start-day"></select>
        <select id="set-start-hour"></select>
      </span>
    </div>
    <div class="set-row">
      <label>סוף הסופ"ש</label>
      <span class="row">
        <select id="set-end-day"></select>
        <select id="set-end-hour"></select>
      </span>
    </div>
  </div>
  <div class="card">
    <div class="row spread">
      <h3 style="font-size:15px">קטגוריות</h3>
      <button class="btn" id="cat-add">+ הוספה</button>
    </div>
    <div id="cat-list"></div>
  </div>
  <div class="card">
    <h3 style="font-size:15px">גיבוי ונתונים</h3>
    <p class="mut">הנתונים נשמרים רק על המכשיר הזה. מומלץ לייצא גיבוי מדי פעם.</p>
    <div class="btn-row">
      <button class="btn primary" id="backup-export">ייצוא גיבוי</button>
      <button class="btn" id="backup-import">ייבוא גיבוי</button>
      <button class="btn" id="csv-export">ייצוא CSV</button>
      <button class="btn danger" id="wipe">מחיקת הכל</button>
    </div>
    <input type="file" id="import-file" accept="application/json" style="display:none">
  </div>
</section>

<!-- tab bar -->
<nav class="tabbar" id="tabbar">
  <button data-s="report" class="on"><span class="ic">💸</span>דיווח</button>
  <button data-s="weekend"><span class="ic">🌅</span>סופ"ש</button>
  <button data-s="month"><span class="ic">📅</span>חודש</button>
  <button data-s="settings"><span class="ic">⚙️</span>הגדרות</button>
</nav>

<div class="toast" id="toast"><span id="toast-msg"></span><button id="toast-undo">ביטול</button></div>

<!-- edit tx modal -->
<div class="modal-back" id="modal-back">
  <div class="modal" id="modal"></div>
</div>

<script>
"use strict";
/* =============================== state =============================== */
const LS_KEY = "shekel-track-v1";
const DAY_NAMES = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const CAT_COLORS = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];

const DEFAULTS = () => ({
  settings: { weekendBudget: 350, startDay: 4, startHour: 18, endDay: 6, endHour: 24 },
  categories: [
    { id: "eat",   name: "אוכל בחוץ",  emoji: "🍔" },
    { id: "market",name: "סופר",       emoji: "🛒" },
    { id: "fun",   name: "בילויים",    emoji: "🎉" },
    { id: "fuel",  name: "דלק ונסיעות",emoji: "⛽" },
    { id: "shop",  name: "קניות",      emoji: "🛍️" },
    { id: "other", name: "אחר",        emoji: "📦" },
  ],
  tx: [],     // {id, type:'expense'|'income', amount, cat, note, ts}
  fixed: [],  // {id, type:'expense'|'income', name, amount}
});

let S = load();
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return DEFAULTS();
    const parsed = JSON.parse(raw);
    return { ...DEFAULTS(), ...parsed, settings: { ...DEFAULTS().settings, ...parsed.settings } };
  } catch { return DEFAULTS(); }
}
function save() { localStorage.setItem(LS_KEY, JSON.stringify(S)); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ============================ money & time =========================== */
const fmt = (n) => "₪" + Math.round(n).toLocaleString("he-IL");
const fmt2 = (n) => "₪" + (+n).toLocaleString("he-IL", { maximumFractionDigits: 2 });

/* Weekend window containing (or after) date d.
   Returns {start, end, id} where id is the ISO date of the start day. */
function weekendWindow(d, s = S.settings) {
  const t = new Date(d);
  // find this week's start-day occurrence
  const start = new Date(t);
  start.setHours(s.startHour, 0, 0, 0);
  const diff = (t.getDay() - s.startDay + 7) % 7;
  start.setDate(start.getDate() - diff);
  const end = new Date(start);
  const span = (s.endDay - s.startDay + 7) % 7;
  end.setDate(start.getDate() + span);
  end.setHours(0, 0, 0, 0);
  end.setTime(end.getTime() + s.endHour * 3600e3);
  if (t < start) { // we're before this week's weekend -> previous window
    start.setDate(start.getDate() - 7);
    end.setDate(end.getDate() - 7);
  }
  return { start, end, id: start.toISOString().slice(0, 10) };
}
function inWeekend(ts) {
  const w = weekendWindow(new Date(ts));
  const t = new Date(ts);
  return t >= w.start && t < w.end ? w : null;
}
function nextWeekendStart(now) {
  const w = weekendWindow(now);
  if (now >= w.end) {
    const n = new Date(w.start); n.setDate(n.getDate() + 7);
    return weekendWindow(n).start;
  }
  return w.start;
}
const catById = (id) => S.categories.find((c) => c.id === id) || { name: "אחר", emoji: "📦", id: "other" };
const catColor = (id) => {
  const i = S.categories.findIndex((c) => c.id === id);
  return CAT_COLORS[(i >= 0 ? i : 5) % CAT_COLORS.length];
};

/* expenses of a given weekend window */
const weekendTx = (w) =>
  S.tx.filter((t) => t.type === "expense" && new Date(t.ts) >= w.start && new Date(t.ts) < w.end);
const sum = (list) => list.reduce((a, t) => a + t.amount, 0);

/* completed weekends (before current), newest first */
function pastWeekends(maxN = 26) {
  const now = new Date();
  const cur = weekendWindow(now);
  const out = [];
  let w = { start: new Date(cur.start), end: new Date(cur.end), id: cur.id };
  const isCurrent = now < cur.end;
  for (let i = 0; i < maxN; i++) {
    w = {
      start: new Date(w.start.getTime() - 7 * 864e5),
      end: new Date(w.end.getTime() - 7 * 864e5),
    };
    w.id = w.start.toISOString().slice(0, 10);
    out.push({ ...w, txs: weekendTx(w), total: sum(weekendTx(w)) });
  }
  if (!isCurrent) out.unshift({ ...cur, txs: weekendTx(cur), total: sum(weekendTx(cur)) });
  // drop empty trailing history before first ever recorded tx
  const firstTs = S.tx.length ? Math.min(...S.tx.map((t) => +new Date(t.ts))) : Date.now();
  return out.filter((w) => w.end.getTime() > firstTs || w.txs.length);
}

/* ============================= navigation ============================ */
const $ = (q) => document.querySelector(q);
document.getElementById("tabbar").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll(".tabbar button").forEach((x) => x.classList.toggle("on", x === b));
  document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
  $("#s-" + b.dataset.s).classList.add("active");
  render();
});

/* ============================ report screen ========================== */
let amountStr = "";
let txType = "expense";

function renderAmount() {
  const disp = $("#amount-display");
  const v = amountStr || "0";
  disp.innerHTML = `<span class="cur">₪</span>${v}`;
  disp.classList.toggle("zero", !amountStr);
}
$("#keypad").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const k = b.dataset.k;
  if (k === "del") amountStr = amountStr.slice(0, -1);
  else if (k === ".") { if (!amountStr.includes(".")) amountStr = (amountStr || "0") + "."; }
  else {
    if (amountStr.replace(".", "").length >= 6) return;
    if (amountStr.includes(".") && amountStr.split(".")[1].length >= 2) return;
    amountStr = amountStr === "0" ? k : amountStr + k;
  }
  renderAmount();
});

let lastAddedId = null, toastTimer = null;
function addTx(type, cat) {
  const amount = parseFloat(amountStr);
  if (!amount || amount <= 0) { showToast("קודם מקלידים סכום 🙂", false); return; }
  const t = { id: uid(), type, amount, cat, note: $("#note-input").value.trim() || null,
              ts: new Date().toISOString() };
  S.tx.push(t); save();
  lastAddedId = t.id;
  amountStr = ""; $("#note-input").value = ""; renderAmount();
  const w = inWeekend(t.ts);
  let msg;
  if (type === "income") msg = `נשמרה הכנסה של ${fmt2(amount)} ✓`;
  else if (w) {
    const left = S.settings.weekendBudget - sum(weekendTx(w));
    msg = left >= 0 ? `נשמר ✓ נשארו ${fmt(left)} לסופ"ש`
                    : `נשמר ✓ חריגה של ${fmt(-left)} מתקציב הסופ"ש`;
  } else msg = `נשמר ✓ ${fmt2(amount)}`;
  showToast(msg, true);
  render();
}
function showToast(msg, withUndo) {
  $("#toast-msg").textContent = msg;
  $("#toast-undo").style.display = withUndo ? "" : "none";
  $("#toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("#toast").classList.remove("show"), 5000);
}
$("#toast-undo").addEventListener("click", () => {
  if (lastAddedId) {
    S.tx = S.tx.filter((t) => t.id !== lastAddedId); save();
    lastAddedId = null; render();
  }
  $("#toast").classList.remove("show");
});

/* ------------ status card (budget ring / next weekend) ------------ */
function ringSvg(frac, color) {
  const r = 46, c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, Math.min(1, frac)));
  return `<svg width="108" height="108" viewBox="0 0 108 108">
    <circle cx="54" cy="54" r="${r}" fill="none" stroke="var(--ring-track)" stroke-width="10"/>
    <circle cx="54" cy="54" r="${r}" fill="none" stroke="${color}" stroke-width="10"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
  </svg>`;
}
function renderStatus() {
  const el = $("#status-card");
  const now = new Date();
  const w = inWeekend(now);
  if (w) {
    const spent = sum(weekendTx(w));
    const budget = S.settings.weekendBudget;
    const left = budget - spent;
    const frac = budget > 0 ? Math.max(0, left) / budget : 0;
    const [color, icon, label] =
      left < 0            ? ["var(--crit)", "❗", "חריגה מהתקציב"] :
      frac < 0.15         ? ["var(--crit)", "⚠️", "נשאר מעט"] :
      frac < 0.4          ? ["var(--warn)", "🙂", "בקצב סביר"] :
                            ["var(--good)", "✅", "אתה בתקציב"];
    el.innerHTML = `
      <div class="ring-wrap">${ringSvg(frac, color)}
        <div class="ring-val"><span class="amt num">${fmt(Math.abs(left))}</span>
        <span class="lbl">${left >= 0 ? "נשארו" : "חריגה"}</span></div>
      </div>
      <div class="status-main">
        <div class="status-title">${icon} ${label}</div>
        <div class="sub status-note num">הוצאת ${fmt(spent)} מתוך ${fmt(budget)} תקציב סופ"ש</div>
        <div class="mut">הסופ"ש נגמר ב${DAY_NAMES[w.end.getDay() === 0 && S.settings.endHour === 24 ? 6 : w.end.getDay()]}${S.settings.endHour === 24 ? " בחצות" : " ב-" + S.settings.endHour + ":00"}</div>
      </div>`;
  } else {
    const nx = nextWeekendStart(now);
    const m = monthTotals(now.getFullYear(), now.getMonth());
    el.innerHTML = `
      <div class="status-main">
        <div class="status-title">🗓️ הסופ"ש הבא: ${DAY_NAMES[nx.getDay()]} ב-${nx.getHours()}:00</div>
        <div class="sub status-note num">תקציב מוכן: ${fmt(S.settings.weekendBudget)}</div>
        <div class="mut num">החודש עד עכשיו: הוצאות ${fmt(m.out)} · הכנסות ${fmt(m.inc)}</div>
      </div>`;
  }
}

/* ============================ weekend screen ========================= */
function renderWeekend() {
  const now = new Date();
  const w = weekendWindow(now);
  const isLive = now >= w.start && now < w.end;
  const txs = weekendTx(w).sort((a, b) => b.ts.localeCompare(a.ts));
  const spent = sum(txs);
  const budget = S.settings.weekendBudget;

  const rangeLabel = (win) =>
    `${win.start.getDate()}.${win.start.getMonth() + 1} - ${new Date(win.end - 1).getDate()}.${new Date(win.end - 1).getMonth() + 1}`;

  $("#wk-current").innerHTML = `
    <div class="row spread">
      <h3 style="font-size:15.5px">${isLive ? "הסופ\"ש הנוכחי" : "הסופ\"ש האחרון"} <span class="mut">(${rangeLabel(w)})</span></h3>
      <span class="badge ${spent <= budget ? "ok" : "over"}">${spent <= budget ? "✓ בתקציב" : "✗ חריגה"}</span>
    </div>
    <div class="sub num" style="margin:4px 0">${fmt(spent)} מתוך ${fmt(budget)}</div>
    <div class="meter"><div style="width:${Math.min(100, budget ? spent / budget * 100 : 0)}%;background:${spent > budget ? "var(--crit)" : "var(--good)"}"></div></div>
    ${txs.length ? txs.map(txItem).join("") : `<div class="empty">עוד אין הוצאות בסופ"ש הזה</div>`}`;

  // insights
  const hist = pastWeekends().filter((x) => x.id !== w.id);
  const withData = hist.filter((x) => x.txs.length);
  const box = $("#wk-insights");
  if (withData.length < 1) {
    box.innerHTML = `<div class="empty">אחרי כמה סופ"שים יופיעו כאן תובנות והשוואות</div>`;
  } else {
    const avg = sum(withData.map((x) => ({ amount: x.total }))) / withData.length;
    const lines = [];
    if (spent > 0 && avg > 0) {
      const d = Math.round((spent / avg - 1) * 100);
      lines.push(d >= 10 ? ["📈", `הסופ"ש הזה יקר ב-${d}% מהממוצע שלך (${fmt(avg)})`]
        : d <= -10 ? ["📉", `הסופ"ש הזה חסכוני ב-${Math.abs(d)}% מהממוצע שלך (${fmt(avg)})`]
        : ["⚖️", `הסופ"ש הזה קרוב לממוצע שלך (${fmt(avg)})`]);
    } else lines.push(["Ø", `ממוצע סופ"ש: ${fmt(avg)} (על בסיס ${withData.length} סופ"שים)`]);
    // top category across weekends
    const catSums = {};
    [...withData.flatMap((x) => x.txs), ...txs].forEach((t) => {
      catSums[t.cat || "other"] = (catSums[t.cat || "other"] || 0) + t.amount;
    });
    const top = Object.entries(catSums).sort((a, b) => b[1] - a[1])[0];
    if (top) {
      const c = catById(top[0]);
      lines.push([c.emoji, `הכי הרבה כסף בסופ"שים הולך ל${c.name} (${fmt(top[1])} סה"כ)`]);
    }
    const okCount = withData.filter((x) => x.total <= budget).length;
    lines.push(["🎯", `עמדת בתקציב ב-${okCount} מתוך ${withData.length} סופ"שים אחרונים`]);
    box.innerHTML = `<h3 style="font-size:15px;margin-bottom:4px">תובנות</h3>` +
      lines.map(([em, t]) => `<div class="insight-line"><span class="em">${em}</span><span>${t}</span></div>`).join("");
  }

  // history
  $("#wk-history").innerHTML = hist.length ? hist.map((x) => `
    <div class="card wk-card">
      <div class="wk-head">
        <span class="wk-title">${rangeLabel(x)}</span>
        <span class="num" style="font-weight:800">${fmt(x.total)}</span>
      </div>
      <div class="meter"><div style="width:${Math.min(100, budget ? x.total / budget * 100 : 0)}%;background:${x.total > budget ? "var(--crit)" : "var(--good)"}"></div></div>
      <span class="badge ${x.total <= budget ? "ok" : "over"}">${x.total <= budget ? "✓ בתקציב" : `✗ חריגה של ${fmt(x.total - budget)}`}</span>
    </div>`).join("") : `<div class="empty">עדיין אין היסטוריה</div>`;
}

function txItem(t) {
  const c = t.type === "income" ? { emoji: "💰", name: "הכנסה" } : catById(t.cat);
  const d = new Date(t.ts);
  const when = `${DAY_NAMES[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1} · ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;

}
const esc = (s) => s.replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

/* ============================= month screen ========================== */
let mYear, mMonth;
{ const n = new Date(); mYear = n.getFullYear(); mMonth = n.getMonth(); }
const MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];

function monthTx(y, m) {
  return S.tx.filter((t) => { const d = new Date(t.ts); return d.getFullYear() === y && d.getMonth() === m; });
}
function monthTotals(y, m) {
  const txs = monthTx(y, m);
  const fixedIn = S.fixed.filter((f) => f.type === "income").reduce((a, f) => a + f.amount, 0);
  const fixedOut = S.fixed.filter((f) => f.type === "expense").reduce((a, f) => a + f.amount, 0);
  const inc = fixedIn + sum(txs.filter((t) => t.type === "income"));
  const out = fixedOut + sum(txs.filter((t) => t.type === "expense"));
  return { inc, out, net: inc - out, txs, fixedIn, fixedOut };
}
$("#m-prev").addEventListener("click", () => { mMonth--; if (mMonth < 0) { mMonth = 11; mYear--; } renderMonth(); });
$("#m-next").addEventListener("click", () => { mMonth++; if (mMonth > 11) { mMonth = 0; mYear++; } renderMonth(); });

function renderMonth() {
  $("#m-label").textContent = `${MONTHS[mMonth]} ${mYear}`;
  const m = monthTotals(mYear, mMonth);
  $("#m-kpis").innerHTML = `
    <div class="kpi"><div class="v num">${fmt(m.inc)}</div><div class="l">הכנסות</div></div>
    <div class="kpi"><div class="v num">${fmt(m.out)}</div><div class="l">הוצאות</div></div>
    <div class="kpi"><div class="v num ${m.net >= 0 ? "pos" : "neg"}">${m.net >= 0 ? "+" : "-"}${fmt(Math.abs(m.net))}</div><div class="l">מאזן</div></div>`;

  // weekend share of month expenses
  const wkSpent = sum(m.txs.filter((t) => t.type === "expense" && inWeekend(t.ts)));
  const repOut = sum(m.txs.filter((t) => t.type === "expense"));
  $("#m-weekend-share").innerHTML = `
    <div class="row spread"><span class="sub">🌅 מזה בסופ"שים</span>
    <span class="num" style="font-weight:800">${fmt(wkSpent)}${repOut ? ` <span class="mut">(${Math.round(wkSpent / repOut * 100)}% מהמדווחות)</span>` : ""}</span></div>`;

  // categories
  const catSums = {};
  m.txs.filter((t) => t.type === "expense").forEach((t) => {
    catSums[t.cat || "other"] = (catSums[t.cat || "other"] || 0) + t.amount;
  });
  const entries = Object.entries(catSums).sort((a, b) => b[1] - a[1]);
  const max = entries.length ? entries[0][1] : 0;
  $("#m-cats").innerHTML = entries.length ? entries.map(([id, v]) => {
    const c = catById(id);
    return `<div class="bar-row">
      <span class="bar-label">${c.emoji} ${c.name}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${max ? v / max * 100 : 0}%;background:${catColor(id)}"></span></span>
      <span class="bar-amt num">${fmt(v)}</span></div>`;
  }).join("") : `<div class="empty">אין הוצאות מדווחות החודש</div>`;

  // fixed list
  $("#fixed-list").innerHTML = S.fixed.length ? S.fixed.map((f) => `
    <div class="tx-item" data-fixed="${f.id}">
      <span class="tx-emoji">${f.type === "income" ? "💰" : "🏠"}</span>
      <span class="tx-main"><div class="tx-name">${esc(f.name)}</div>
      <div class="tx-time">${f.type === "income" ? "הכנסה קבועה" : "הוצאה קבועה"}</div></span>
      <span class="tx-amt num ${f.type === "income" ? "in" : ""}">${f.type === "income" ? "+" : "-"}${fmt2(f.amount)}</span>
    </div>`).join("") : `<div class="empty">אין קבועות עדיין - הוסף משכורת, שכ"ד, מנויים</div>`;

  // month tx list
  const list = [...m.txs].sort((a, b) => b.ts.localeCompare(a.ts));
  $("#m-tx").innerHTML = list.length ? list.map(txItem).join("") : `<div class="empty">אין תנועות החודש</div>`;
}

/* -------- backup / export -------- */
function download(filename, text, mime) {
  const doIt = async () => {
    if (window.claude?.downloads) {
      try { await window.claude.downloads.save({ filename, data: text }); return; } catch {}
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: mime }));
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  doIt();
}
$("#backup-export").addEventListener("click", () => {
  download(`kesef-backup-${new Date().toISOString().slice(0, 10)}.json`,
    JSON.stringify(S, null, 2), "application/json");
});
$("#backup-import").addEventListener("click", () => $("#import-file").click());
$("#import-file").addEventListener("change", (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data.tx || !data.settings) throw new Error("bad file");
      S = { ...DEFAULTS(), ...data, settings: { ...DEFAULTS().settings, ...data.settings } };
      save(); render(); showToast("הגיבוי יובא בהצלחה ✓", false);
    } catch { showToast("קובץ לא תקין", false); }
  };
  r.readAsText(f);
  e.target.value = "";
});
$("#csv-export").addEventListener("click", () => {
  const rows = [["date", "time", "type", "category", "amount", "note", "weekend"]];
  [...S.tx].sort((a, b) => a.ts.localeCompare(b.ts)).forEach((t) => {
    const d = new Date(t.ts);
    rows.push([d.toISOString().slice(0, 10), d.toTimeString().slice(0, 5), t.type,
      t.type === "expense" ? catById(t.cat).name : "",
      t.amount, t.note || "", inWeekend(t.ts) ? "yes" : "no"]);
  });
  const csv = "﻿" + rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
  download("kesef-data.csv", csv, "text/csv;charset=utf-8");
});
$("#wipe").addEventListener("click", () => {
  modal(`
    <h3>למחוק את כל הנתונים?</h3>
    <p class="sub">הפעולה בלתי הפיכה. מומלץ לייצא גיבוי קודם.</p>
    <div class="btn-row">
      <button class="btn danger" id="w-yes">כן, מחק הכל</button>
      <button class="btn primary" id="w-no">ביטול</button>
    </div>`);
  $("#w-yes").onclick = () => { S = DEFAULTS(); save(); closeModal(); render(); };
  $("#w-no").onclick = closeModal;
});

/* ============================== render all =========================== */
function render() {
  renderStatus(); renderCats(); renderAmount();
  renderWeekend(); renderMonth(); renderSettings();
}
render();

/* offline support (works when served over http; silently skipped otherwise) */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
