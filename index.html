<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>הכסף שלי</title>
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הכסף שלי">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* ---------- palette roles (light) + dark below ---------- */
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,.10);
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
  --good-text: #006300;
  --accent: #2a78d6;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300;
  --ring-track: #e1e0d9;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,.10);
    --good-text: #0ca30c;
    --accent: #3987e5;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300;
    --ring-track: #2c2c2a;
  }
}
/* explicit theme toggle (e.g. claude.ai artifact viewer) wins both ways */
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,.10);
  --good-text: #0ca30c;
  --accent: #3987e5;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300;
  --ring-track: #2c2c2a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  direction: rtl; /* keeps RTL even when served without the <html dir> wrapper */
  background: var(--page); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px; line-height: 1.5;
  max-width: 560px; margin: 0 auto;
}
h1,h2,h3 { margin: 0; }
button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
input, select { font: inherit; color: var(--ink); background: var(--page);
  border: 1px solid var(--baseline); border-radius: 10px; padding: 9px 12px; max-width: 100%; }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.num { font-variant-numeric: tabular-nums; }

.screen { display: none; padding: calc(8px + env(safe-area-inset-top)) 16px calc(72px + env(safe-area-inset-bottom)); }
.screen.active { display: block; }
/* report fills the viewport: keypad grows to sit just above the tab bar */
#s-report.active { display: flex; flex-direction: column; min-height: 100dvh; }
#s-report #keypad { flex: 1 1 auto; grid-template-rows: repeat(4, minmax(46px, 1fr)); margin-top: 8px; }
.screen.from-next { animation: slide-next .3s cubic-bezier(.22,.61,.36,1); }
.screen.from-prev { animation: slide-prev .3s cubic-bezier(.22,.61,.36,1); }
@keyframes slide-next { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }
@keyframes slide-prev { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen.from-next, .screen.from-prev { animation: none; } }
.card { background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 14px 16px; margin: 10px 0; }
.mut { color: var(--muted); font-size: 13px; }
.sub { color: var(--ink-2); font-size: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.spread { justify-content: space-between; }

/* ---------- top status / budget ring ---------- */
.status-card { display: flex; align-items: center; gap: 16px; }
.ring-wrap { position: relative; width: 108px; height: 108px; flex: none; }
.ring-wrap svg { transform: rotate(-90deg); }
.ring-val { position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; }
.ring-val .amt { font-size: 21px; font-weight: 800; }
.ring-val .lbl { font-size: 10.5px; color: var(--muted); margin-top: -3px; }
.status-main { flex: 1; min-width: 0; }
.status-title { font-size: 16px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
.status-note { margin-top: 2px; }

/* ---------- report screen ---------- */
.amount-display {
  text-align: center; font-size: 42px; font-weight: 800; letter-spacing: 1px;
  padding: 1px 0; min-height: 44px;
}
.amount-display .cur { font-size: 26px; color: var(--muted); font-weight: 600; }
.amount-display.zero { color: var(--baseline); }
.type-toggle { display: flex; background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; padding: 3px; width: fit-content; margin: 0 auto 6px; }
.type-toggle button { padding: 5px 18px; border-radius: 999px; font-size: 13.5px;
  font-weight: 600; color: var(--ink-2); }
.type-toggle button.on { background: var(--accent); color: #fff; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin: 6px 0 0;
  direction: ltr; /* dialer-style 1-2-3 left-to-right */ }
.keypad button {
  background: var(--surface); border: 1px solid var(--border); border-radius: 13px;
  font-size: 23px; font-weight: 600; padding: 8px 0;
}
.keypad button:active { background: var(--grid); }
.note-row input { width: 100%; }
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.cat-btn {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 8px 4px; text-align: center; font-size: 12.5px; font-weight: 600;
  display: flex; flex-direction: column; gap: 2px; align-items: center;
}
.cat-btn .em { font-size: 20px; }
.cat-btn:active { background: var(--grid); }
.save-income {
  width: 100%; background: var(--accent); color: #fff; font-weight: 700;
  border-radius: 14px; padding: 14px 0; font-size: 17px; margin-top: 10px;
}
.hint { text-align: center; margin-top: 8px; }

/* ---------- lists ---------- */
.tx-item { display: flex; align-items: center; gap: 10px; padding: 9px 2px;
  border-top: 1px solid var(--grid); }
.tx-item:first-child { border-top: none; }
.tx-emoji { font-size: 20px; flex: none; width: 28px; text-align: center; }
.tx-main { flex: 1; min-width: 0; }
.tx-name { font-size: 14.5px; font-weight: 600; }
.tx-time { font-size: 12px; color: var(--muted); }
.tx-amt { font-weight: 700; font-size: 15.5px; direction: ltr; unicode-bidi: isolate; }
.tx-amt.in { color: var(--good-text); }

/* ---------- weekend history ---------- */
.wk-card { padding: 11px 14px; }
.wk-head { display: flex; justify-content: space-between; align-items: baseline; }
.wk-title { font-weight: 700; font-size: 14.5px; }
.meter { height: 8px; border-radius: 4px; background: var(--ring-track);
  margin: 8px 0 4px; overflow: hidden; direction: ltr; }
.meter > div { height: 100%; border-radius: 4px; }
.badge { font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 999px;
  border: 1px solid var(--border); }
.badge.ok { color: var(--good-text); }
.badge.over { color: var(--crit); }

/* ---------- month ---------- */
.month-nav { display: flex; align-items: center; justify-content: space-between; margin: 4px 0; }
.month-nav button { font-size: 22px; padding: 4px 14px; color: var(--ink-2); }
.month-nav .cur-month { font-weight: 700; font-size: 16.5px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 10px 12px; text-align: center; }
.kpi .v { font-size: 19px; font-weight: 800; }
.kpi .l { font-size: 12px; color: var(--muted); }
.kpi .v.pos { color: var(--good-text); }
.kpi .v.neg { color: var(--crit); }
.bar-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.bar-label { width: 108px; flex: none; font-size: 13.5px; display: flex; gap: 6px; align-items: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-track { flex: 1; height: 14px; background: none; direction: ltr; display: flex; justify-content: flex-end; }
.bar-fill { height: 100%; border-radius: 4px 0 0 4px; min-width: 2px; }
.bar-amt { width: 64px; flex: none; text-align: left; font-size: 13px; font-weight: 600; direction: ltr; }

/* ---------- settings ---------- */
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 10px 0; border-top: 1px solid var(--grid); }
.set-row:first-child { border-top: none; }
.set-row label { font-size: 14.5px; }
.set-row input[type=number] { width: 90px; text-align: center; }
.btn { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 9px 16px; font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--crit); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  display: flex; background: var(--surface); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom); max-width: 560px; margin: 0 auto;
}
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 1px; padding: 8px 0 6px; font-size: 11px; color: var(--muted); font-weight: 600; }
.tabbar button .ic { font-size: 21px; }
.tabbar button.on { color: var(--accent); }

/* ---------- toast / modal ---------- */
.toast {
  position: fixed; bottom: calc(76px + env(safe-area-inset-bottom)); left: 14px; right: 14px;
  max-width: 532px; margin: 0 auto; z-index: 40;
  background: var(--ink); color: var(--page); border-radius: 14px; padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-size: 14.5px; font-weight: 600;
  transform: translateY(20px); opacity: 0; pointer-events: none; transition: .18s;
}
.toast.show { transform: none; opacity: 1; pointer-events: auto; }
.toast button { color: var(--warn); font-weight: 800; font-size: 14.5px; flex: none; }
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30;
  display: none; align-items: flex-end; justify-content: center; }
.modal-back.show { display: flex; }
.modal { background: var(--page); width: 100%; max-width: 560px;
  border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
.modal h3 { margin-bottom: 10px; }
.modal .field { margin: 10px 0; }
.modal .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 3px; }
.modal .field input, .modal .field select { width: 100%; }
.empty { text-align: center; color: var(--muted); padding: 22px 0; font-size: 14px; }
.insight-line { display: flex; gap: 8px; padding: 5px 0; font-size: 14.5px; align-items: baseline; }
.insight-line .em { flex: none; }

/* ---------- compact report layout ---------- */
.budget-strip { border-radius: 12px; padding: 7px 12px; margin: 2px 0 6px;
  font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--border); background: var(--surface); }
.budget-strip .bs-bar { flex: 1; height: 7px; border-radius: 4px; background: var(--ring-track);
  overflow: hidden; direction: ltr; }
.budget-strip .bs-bar > div { height: 100%; border-radius: 4px; }
.budget-strip .bs-amt { flex: none; direction: ltr; unicode-bidi: isolate; }
.seg { display: flex; background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; padding: 3px; margin: 0 auto 4px; width: fit-content; }
.seg button { padding: 5px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
  color: var(--ink-2); white-space: nowrap; }
.seg button.on { background: var(--accent); color: #fff; }
.bucket-seg { width: 100%; }
.bucket-seg button { flex: 1; padding: 6px 4px; }
.bucket-seg button.on { background: var(--accent); }
.cats-strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px;
  -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.cats-strip::-webkit-scrollbar { display: none; }
.cats-strip .cat-btn { flex: 0 0 auto; width: 78px; }
.note-inline { width: 100%; padding: 6px 12px; margin-bottom: 3px; }

/* ---------- vertical bar chart (trends) ---------- */
.vchart { display: flex; align-items: flex-end; gap: 6px; height: 118px;
  direction: ltr; padding-top: 16px; }
.vbar-col { flex: 1; min-width: 0; display: flex; flex-direction: column;
  justify-content: flex-end; align-items: center; height: 100%; }
.vbar-wrap { width: 100%; display: flex; justify-content: center; align-items: flex-end;
  height: 100%; position: relative; }
.vbar { width: 100%; max-width: 30px; border-radius: 5px 5px 0 0; background: var(--accent);
  position: relative; min-height: 2px; }
.vbar.over { background: var(--crit); }
.vbar .vval { position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
  font-size: 9.5px; font-weight: 700; white-space: nowrap; color: var(--ink-2); }
.vlab { font-size: 9.5px; color: var(--muted); margin-top: 4px; direction: ltr; white-space: nowrap; }
.chart-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 20px 0; }
.budget-line { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--baseline); }
.budget-line span { position: absolute; top: -8px; right: 0; font-size: 9px; color: var(--muted);
  background: var(--surface); padding: 0 3px; }

/* ===================== professional / statistical polish ===================== */
body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
:root { --shadow: 0 1px 2px rgba(16,24,40,.04), 0 6px 16px rgba(16,24,40,.06);
        --shadow-sm: 0 1px 2px rgba(16,24,40,.05); --radius: 18px; }
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) {
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.5); --shadow-sm: 0 1px 2px rgba(0,0,0,.4); } }
:root[data-theme="dark"] { --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.5); --shadow-sm: 0 1px 2px rgba(0,0,0,.4); }

.card { border-radius: var(--radius); box-shadow: var(--shadow); }
.card h3 { font-size: 14px; font-weight: 700; letter-spacing: .1px; }
.h-sub, .mut { letter-spacing: .1px; }

/* section title with accent tick */
.card > h3:first-child { position: relative; padding-inline-start: 11px; }
.card > h3:first-child::before { content: ""; position: absolute; inset-inline-start: 0; top: 2px;
  width: 3px; height: 14px; border-radius: 2px; background: var(--accent); opacity: .85; }

/* stat tiles */
.kpi { border-radius: 15px; box-shadow: var(--shadow-sm); padding: 11px 10px; text-align: right; }
.kpi .l { font-size: 11px; font-weight: 600; text-transform: none; letter-spacing: .2px; margin-bottom: 2px; }
.kpi .v { font-size: 20px; line-height: 1.1; }
.kpi .cap { font-size: 10.5px; color: var(--muted); margin-top: 2px; font-weight: 600; }

/* budget strip refined */
.budget-strip { box-shadow: var(--shadow-sm); border-radius: 14px; }

/* segmented controls */
.seg, .type-toggle { box-shadow: var(--shadow-sm); }
.seg button, .bucket-seg button { transition: background .15s, color .15s; }

/* amount readout */
.amount-display { background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  box-shadow: var(--shadow-sm); margin: 2px 0; padding: 7px 0; min-height: 0;
  display: flex; align-items: center; justify-content: center; gap: 2px; }

/* keypad */
.keypad button { box-shadow: var(--shadow-sm); transition: transform .06s, background .12s; }
.keypad button:active { transform: scale(.97); }
.cat-btn { box-shadow: var(--shadow-sm); }

/* tab bar premium */
.tabbar { box-shadow: 0 -1px 0 var(--border), 0 -8px 24px rgba(16,24,40,.05);
  backdrop-filter: saturate(1.4); }
.tabbar button { position: relative; padding-top: 10px; }
.tabbar button.on::before { content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 26px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.tabbar button .ic { font-size: 20px; transition: transform .15s; }
.tabbar button.on .ic { transform: translateY(-1px) scale(1.08); }

/* meters / bars rounder */
.meter { height: 9px; border-radius: 5px; }
.vbar { border-radius: 6px 6px 0 0; }

/* transaction rows a touch airier */
.tx-item { padding: 10px 2px; }
.badge { padding: 2px 10px; }

/* quick amounts row */
.quick-amounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin: 6px 0;
  direction: ltr; }
.qa-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 13px;
  font-size: 14px; font-weight: 700; padding: 8px 0; box-shadow: var(--shadow-sm);
  transition: transform .06s, background .12s; }
.qa-btn:active { transform: scale(.97); }
.qa-btn#repeat-last { color: var(--ink-2); font-size: 16px; }
</style>
</head>
<body>

<!-- ================= REPORT ================= -->
<section id="s-report" class="screen active">
  <div id="budget-strip" class="budget-strip"></div>
  <div class="seg" id="type-toggle">
    <button data-type="expense" class="on">הוצאה</button>
    <button data-type="income">הכנסה</button>
  </div>
  <div class="seg bucket-seg" id="bucket-toggle">
    <button data-bucket="base">בסיס (חול)</button>
    <button data-bucket="weekend">סופ"ש</button>
    <button data-bucket="other">אחר</button>
  </div>
  <div class="amount-display zero" id="amount-display"><span class="cur">₪</span>0</div>
  <div class="quick-amounts" id="quick-amounts">
    <button class="qa-btn" data-qa="20">₪20</button>
    <button class="qa-btn" data-qa="50">₪50</button>
    <button class="qa-btn" data-qa="100">₪100</button>
    <button class="qa-btn" id="repeat-last" title="חזור על ההוצאה האחרונה">↻</button>
  </div>
  <input id="note-input" class="note-inline" placeholder="הערה (אופציונלי)" autocomplete="off">
  <div class="cats-strip" id="cats" data-noswipe></div>
  <button class="save-income" id="save-income" style="display:none">שמור הכנסה ✓</button>
  <div class="keypad" id="keypad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k=".">.</button><button data-k="0">0</button><button data-k="del">⌫</button>
  </div>
</section>

<!-- ================= WEEKEND ================= -->
<section id="s-weekend" class="screen">
  <h2 style="font-size:19px;margin:6px 2px">סופי שבוע</h2>
  <div class="card" id="wk-current"></div>
  <div class="card">
    <h3 style="font-size:15px">מגמת הוצאות סופ"ש</h3>
    <div id="wk-chart"></div>
  </div>
  <div class="card" id="wk-insights"></div>
  <h3 style="font-size:15px;margin:14px 2px 4px">היסטוריית סופ"שים</h3>
  <div id="wk-history"></div>
</section>

<!-- ================= MONTH ================= -->
<section id="s-month" class="screen">
  <div class="month-nav">
    <button id="m-prev">‹</button>
    <div class="cur-month" id="m-label"></div>
    <button id="m-next">›</button>
  </div>
  <div class="kpis" id="m-kpis"></div>
  <div class="card" id="m-budget"></div>
  <div class="card" id="m-weekend-share"></div>
  <div class="card">
    <h3 style="font-size:15px">מגמה חודשית</h3>
    <div id="m-chart"></div>
  </div>
  <div class="card">
    <h3 style="font-size:15px">לאן הלך הכסף</h3>
    <div id="m-cats"></div>
  </div>
  <div class="card">
    <div class="row spread">
      <h3 style="font-size:15px">קבועות חודשיות</h3>
      <button class="btn" id="fixed-add">+ הוספה</button>
    </div>
    <p class="mut" style="margin:2px 0 4px">משכורת, שכ"ד, מנויים - נספרות אוטומטית בכל חודש</p>
    <div id="fixed-list"></div>
  </div>
  <div class="card">
    <h3 style="font-size:15px">כל התנועות של החודש</h3>
    <div id="m-tx"></div>
  </div>
</section>

<!-- ================= SETTINGS ================= -->
<section id="s-settings" class="screen">
  <h2 style="font-size:19px;margin:6px 2px">הגדרות</h2>
  <div class="card">
    <div class="set-row">

<script>
"use strict";
/* =============================== state =============================== */
const LS_KEY = "shekel-track-v1";
const DAY_NAMES = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const CAT_COLORS = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];

const DEFAULTS = () => ({
  settings: { weekendBudget: 350, monthlyBudget: 0, savingsGoal: 0, startDay: 4, startHour: 18, endDay: 6, endHour: 24 },
  categories: [
    { id: "eat",   name: "אוכל בחוץ",  emoji: "🍔" },
    { id: "market",name: "סופר",       emoji: "🛒" },
    { id: "fun",   name: "בילויים",    emoji: "🎉" },
    { id: "fuel",  name: "דלק ונסיעות",emoji: "⛽" },
    { id: "shop",  name: "קניות",      emoji: "🛍️" },
    { id: "other", name: "אחר",        emoji: "📦" },
  ],
  tx: [],     // {id, type:'expense'|'income', amount, cat, note, ts, bucket:'weekend'|'base'|'other'}
  fixed: [],  // {id, type:'expense'|'income', name, amount}
});

let S = load();
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return DEFAULTS();
    const parsed = JSON.parse(raw);
    const s = { ...DEFAULTS(), ...parsed, settings: { ...DEFAULTS().settings, ...parsed.settings } };
    // migrate old expenses that predate manual buckets: tag by their timestamp
    (s.tx || []).forEach((t) => {
      if (t.type === "expense" && !t.bucket) {
        const inW = t.ts && (() => { const w = weekendWindow(new Date(t.ts), s.settings);
          const d = new Date(t.ts); return d >= w.start && d < w.end; })();
        t.bucket = inW ? "weekend" : "base";
      }
    });
    return s;
  } catch { return DEFAULTS(); }
}
function save() { localStorage.setItem(LS_KEY, JSON.stringify(S)); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ============================ money & time =========================== */
const fmt = (n) => "₪" + Math.round(n).toLocaleString("he-IL");
const fmt2 = (n) => "₪" + (+n).toLocaleString("he-IL", { maximumFractionDigits: 2 });

/* Weekend window containing (or after) date d.
   Returns {start, end, id} where id is the ISO date of the start day. */
function weekendWindow(d, s = S.settings) {
  const t = new Date(d);
  // find this week's start-day occurrence
  const start = new Date(t);
  start.setHours(s.startHour, 0, 0, 0);
  const diff = (t.getDay() - s.startDay + 7) % 7;
  start.setDate(start.getDate() - diff);
  const end = new Date(start);
  const span = (s.endDay - s.startDay + 7) % 7;
  end.setDate(start.getDate() + span);
  end.setHours(0, 0, 0, 0);
  end.setTime(end.getTime() + s.endHour * 3600e3);
  if (t < start) { // we're before this week's weekend -> previous window
    start.setDate(start.getDate() - 7);
    end.setDate(end.getDate() - 7);
  }
  return { start, end, id: start.toISOString().slice(0, 10) };
}
function inWeekend(ts) {
  const w = weekendWindow(new Date(ts));
  const t = new Date(ts);
  return t >= w.start && t < w.end ? w : null;
}
/* The weekend a (manually-tagged) expense belongs to: the window containing it,
   otherwise the nearest window by time - so "weekend" shopping done Thursday
   afternoon lands on the upcoming weekend, not the one that just ended. */
function weekendOf(ts) {
  const t = new Date(ts);
  const w = weekendWindow(t);
  if (t < w.end) return w;
  const nextStart = new Date(w.start); nextStart.setDate(nextStart.getDate() + 7);
  const nx = weekendWindow(nextStart);
  return (nx.start - t) < (t - w.end) ? nx : w;
}
function upcomingOrCurrentWeekend() {
  const now = new Date();
  const w = weekendWindow(now);
  if (now < w.end) return w;
  const ns = new Date(w.start); ns.setDate(ns.getDate() + 7);
  return weekendWindow(ns);
}
function nextWeekendStart(now) {
  const w = weekendWindow(now);
  if (now >= w.end) {
    const n = new Date(w.start); n.setDate(n.getDate() + 7);
    return weekendWindow(n).start;
  }
  return w.start;
}
const catById = (id) => S.categories.find((c) => c.id === id) || { name: "אחר", emoji: "📦", id: "other" };
const catColor = (id) => {
  const i = S.categories.findIndex((c) => c.id === id);
  return CAT_COLORS[(i >= 0 ? i : 5) % CAT_COLORS.length];
};

/* expenses tagged as weekend that belong to a given weekend window */
const weekendTx = (w) =>
  S.tx.filter((t) => t.type === "expense" && t.bucket === "weekend" && weekendOf(t.ts).id === w.id);
const sum = (list) => list.reduce((a, t) => a + t.amount, 0);

/* completed weekends (before current), newest first */
function pastWeekends(maxN = 26) {
  const now = new Date();
  const cur = weekendWindow(now);
  const out = [];
  let w = { start: new Date(cur.start), end: new Date(cur.end), id: cur.id };
  const isCurrent = now < cur.end;
  for (let i = 0; i < maxN; i++) {
    w = {
      start: new Date(w.start.getTime() - 7 * 864e5),
      end: new Date(w.end.getTime() - 7 * 864e5),
    };
    w.id = w.start.toISOString().slice(0, 10);
    out.push({ ...w, txs: weekendTx(w), total: sum(weekendTx(w)) });
  }
  if (!isCurrent) out.unshift({ ...cur, txs: weekendTx(cur), total: sum(weekendTx(cur)) });
  // drop empty trailing history before first ever recorded tx
  const firstTs = S.tx.length ? Math.min(...S.tx.map((t) => +new Date(t.ts))) : Date.now();
  return out.filter((w) => w.end.getTime() > firstTs || w.txs.length);
}

/* ============================= navigation ============================ */
const $ = (q) => document.querySelector(q);
const SCREENS = ["report", "weekend", "month", "settings"];
let curScreen = 0;
function goToScreen(i) {
  const target = Math.max(0, Math.min(SCREENS.length - 1, i));
  const dir = target > curScreen ? 1 : target < curScreen ? -1 : 0;
  curScreen = target;
  const name = SCREENS[curScreen];
  document.querySelectorAll(".tabbar button").forEach((x) => x.classList.toggle("on", x.dataset.s === name));
  document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active", "from-next", "from-prev"));
  const el = $("#s-" + name);
  el.classList.add("active");
  if (dir) el.classList.add(dir > 0 ? "from-next" : "from-prev");
  window.scrollTo(0, 0);
  render();
}
document.getElementById("tabbar").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  goToScreen(SCREENS.indexOf(b.dataset.s));
});

/* swipe between screens (left = next screen, right = previous) */
let tsx = 0, tsy = 0, swiping = false;
document.body.addEventListener("touchstart", (e) => {
  if (e.touches.length !== 1 || $("#modal-back").classList.contains("show")
      || e.target.closest("[data-noswipe]")) { swiping = false; return; }
  tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; swiping = true;
}, { passive: true });
document.body.addEventListener("touchend", (e) => {
  if (!swiping) return; swiping = false;
  const dx = e.changedTouches[0].clientX - tsx;
  const dy = e.changedTouches[0].clientY - tsy;
  // RTL: swipe right advances to the next tab, swipe left goes back
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.6) {
    goToScreen(curScreen + (dx > 0 ? 1 : -1));
  }
}, { passive: true });

/* ============================ report screen ========================== */
let amountStr = "";
let txType = "expense";
let txBucket = inWeekend(new Date()) ? "weekend" : "base";

function renderAmount() {
  const disp = $("#amount-display");
  const v = amountStr || "0";
  disp.innerHTML = `<span class="cur">₪</span>${v}`;
  disp.classList.toggle("zero", !amountStr);
}

function getLastExpense() {
  const exps = S.tx.filter((t) => t.type === "expense").sort((a, b) => b.ts.localeCompare(a.ts));
  return exps.length ? exps[0] : null;
}

function updateRepeatButton() {
  const btn = $("#repeat-last");
  const last = getLastExpense();
  btn.style.opacity = last ? "1" : "0.5";
  btn.disabled = !last;
  if (last) {
    const c = catById(last.cat);
    btn.title = `חזור: ${c.emoji} ${c.name} · ${fmt2(last.amount)}`;
  }
}
$("#keypad").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const k = b.dataset.k;
  if (k === "del") amountStr = amountStr.slice(0, -1);
  else if (k === ".") { if (!amountStr.includes(".")) amountStr = (amountStr || "0") + "."; }
  else {
    if (amountStr.replace(".", "").length >= 6) return;
    if (amountStr.includes(".") && amountStr.split(".")[1].length >= 2) return;
    amountStr = amountStr === "0" ? k : amountStr + k;
  }
  renderAmount();
});

// Quick amount buttons
document.querySelectorAll(".qa-btn[data-qa]").forEach((btn) => {
  btn.addEventListener("click", () => {
    amountStr = btn.dataset.qa;
    renderAmount();
  });
});

// Repeat last expense
$("#repeat-last").addEventListener("click", () => {
  const last = getLastExpense(); if (!last) return;
  amountStr = String(last.amount);
  txBucket = last.bucket || "base";
  txType = "expense";
  syncBucketButtons();
  updateBudgetStrip();
  renderAmount();
  $("#note-input").value = (last.note || "");
  showToast(`חוזר: ${catById(last.cat).emoji} ${catById(last.cat).name} — בחר קטגוריה לשמירה`, false);
  // Scroll to categories
  setTimeout(() => document.querySelector("#cats").scrollIntoView({ behavior: "smooth", block: "nearest" }), 200);
});
$("#type-toggle").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  txType = b.dataset.type;
  document.querySelectorAll("#type-toggle button").forEach((x) => x.classList.toggle("on", x === b));
  const isExp = txType === "expense";
  $("#cats").style.display = isExp ? "" : "none";
  $("#bucket-toggle").style.display = isExp ? "" : "none";
  $("#save-income").style.display = isExp ? "none" : "";
  updateBudgetStrip();
});
$("#bucket-toggle").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  txBucket = b.dataset.bucket;
  syncBucketButtons();
  updateBudgetStrip();
});
function syncBucketButtons() {
  document.querySelectorAll("#bucket-toggle button")
    .forEach((x) => x.classList.toggle("on", x.dataset.bucket === txBucket));
}

/* Live strip at the top of the report screen: what this expense counts against */
function updateBudgetStrip() {
  const el = $("#budget-strip");
  if (txType === "income") {
    el.innerHTML = `<span>💰 הכנסה חדשה — תיכנס להכנסות החודש</span>`;
    return;
  }
  if (txBucket === "weekend") {
    const now = new Date();
    const w = weekendOf(now);           // the window a new weekend expense files into
    const budget = S.settings.weekendBudget;
    const spent = sum(weekendTx(w));
    const left = budget - spent;
    const frac = budget > 0 ? Math.max(0, left) / budget : 0;
    const color = left < 0 ? "var(--crit)" : frac < 0.2 ? "var(--warn)" : "var(--good)";
    const label = inWeekend(now) ? "סופ\"ש" : (w.end < now ? "סופ\"ש אחרון" : "לסופ\"ש הבא");
    el.innerHTML = `<span>🌅 ${label}</span>
      <span class="bs-bar"><div style="width:${Math.min(100, budget ? spent / budget * 100 : 0)}%;background:${color}"></div></span>
      <span class="bs-amt" style="color:${color}">${left >= 0 ? "נשארו " + fmt(left) : "חריגה " + fmt(-left)}</span>`;
  } else if (txBucket === "base") {
    const now = new Date();
    const m = monthTotals(now.getFullYear(), now.getMonth());
    const mb = S.settings.monthlyBudget;
    if (mb > 0) {
      const left = mb - m.reportedOut;
      const color = left < 0 ? "var(--crit)" : (mb ? Math.max(0, left) / mb : 0) < 0.2 ? "var(--warn)" : "var(--good)";
      el.innerHTML = `<span>📅 תקציב חודשי</span>
        <span class="bs-bar"><div style="width:${Math.min(100, mb ? m.reportedOut / mb * 100 : 0)}%;background:${color}"></div></span>
        <span class="bs-amt" style="color:${color}">${left >= 0 ? "נשארו " + fmt(left) : "חריגה " + fmt(-left)}</span>`;
    } else {
      el.innerHTML = `<span>📅 יום חול — נכנס להוצאות החודש</span><span class="bs-amt">${fmt(m.reportedOut)} החודש</span>`;
    }
  } else {
    el.innerHTML = `<span>🏷️ "אחר" — נכנס להוצאות החודש (בנפרד מהסופ"ש)</span>`;
  }
}

function renderCats() {
  $("#cats").innerHTML = S.categories.map((c) =>
    `<button class="cat-btn" data-cat="${c.id}"><span class="em">${c.emoji}</span>${c.name}</button>`
  ).join("");
}
$("#cats").addEventListener("click", (e) => {
  const b = e.target.closest(".cat-btn"); if (!b) return;
  addTx("expense", b.dataset.cat);
});
$("#save-income").addEventListener("click", () => addTx("income", null));

let lastAddedId = null, toastTimer = null;
function addTx(type, cat) {
  const amount = parseFloat(amountStr);
  if (!amount || amount <= 0) { showToast("קודם מקלידים סכום 🙂", false); return; }
  const t = { id: uid(), type, amount, cat, note: $("#note-input").value.trim() || null,
              ts: new Date().toISOString(), bucket: type === "expense" ? txBucket : null };
  S.tx.push(t); save();
  lastAddedId = t.id;
  amountStr = ""; $("#note-input").value = ""; renderAmount();
  let msg;
  if (type === "income") msg = `נשמרה הכנסה של ${fmt2(amount)} ✓`;
  else if (t.bucket === "weekend") {
    const left = S.settings.weekendBudget - sum(weekendTx(weekendOf(t.ts)));
    msg = left >= 0 ? `נשמר ✓ נשארו ${fmt(left)} לסופ"ש`
                    : `נשמר ✓ חריגה של ${fmt(-left)} מתקציב הסופ"ש`;
  } else if (t.bucket === "other") msg = `נשמר ✓ ${fmt2(amount)} · הוצאת "אחר"`;
  else msg = `נשמר ✓ ${fmt2(amount)} · נכנס להוצאות החודש`;
  showToast(msg, true);
  render();
}
function showToast(msg, withUndo) {
  $("#toast-msg").textContent = msg;
  $("#toast-undo").style.display = withUndo ? "" : "none";
  $("#toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("#toast").classList.remove("show"), 5000);
}
$("#toast-undo").addEventListener("click", () => {
  if (lastAddedId) {
    S.tx = S.tx.filter((t) => t.id !== lastAddedId); save();
    lastAddedId = null; render();
  }
  $("#toast").classList.remove("show");
});

/* ------------ status card (budget ring / next weekend) ------------ */
function ringSvg(frac, color) {
  const r = 46, c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, Math.min(1, frac)));
  return `<svg width="108" height="108" viewBox="0 0 108 108">
    <circle cx="54" cy="54" r="${r}" fill="none" stroke="var(--ring-track)" stroke-width="10"/>
    <circle cx="54" cy="54" r="${r}" fill="none" stroke="${color}" stroke-width="10"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
  </svg>`;
}
/* vertical bar chart (oldest→newest, left→right). items: [{label,value,over}] */
function vbars(items, budget) {
  if (!items.length || items.every((x) => !x.value)) {
    return `<div class="chart-empty">אין עדיין מספיק נתונים לגרף</div>`;
  }
  const max = Math.max(budget || 0, ...items.map((x) => x.value)) * 1.12 || 1;
  const line = budget > 0
    ? `<div class="budget-line" style="bottom:${16 + (budget / max) * (118 - 16)}px"><span>תקציב ${fmt(budget)}</span></div>`
    : "";
  return `<div class="vchart" style="position:relative">${line}` + items.map((x) => `
    <div class="vbar-col">
      <div class="vbar-wrap">
        <div class="vbar ${x.over ? "over" : ""}" style="height:${Math.max(2, x.value / max * 100)}%">
          ${x.value ? `<span class="vval num">${fmt(x.value)}</span>` : ""}
        </div>
      </div>
      <div class="vlab">${x.label}</div>
    </div>`).join("") + `</div>`;
}

/* ============================ weekend screen ========================= */
function renderWeekend() {
  const now = new Date();
  const w = weekendWindow(now);
  const isLive = now >= w.start && now < w.end;
  const txs = weekendTx(w).sort((a, b) => b.ts.localeCompare(a.ts));
  const spent = sum(txs);
  const budget = S.settings.weekendBudget;

  const rangeLabel = (win) =>
    `${win.start.getDate()}.${win.start.getMonth() + 1} - ${new Date(win.end - 1).getDate()}.${new Date(win.end - 1).getMonth() + 1}`;

  const left = budget - spent;
  const frac = budget > 0 ? Math.max(0, left) / budget : 0;
  const ringColor = left < 0 ? "var(--crit)" : frac < 0.2 ? "var(--warn)" : "var(--good)";
  $("#wk-current").innerHTML = `
    <div class="status-card" style="margin-bottom:10px">
      <div class="ring-wrap">${ringSvg(frac, ringColor)}
        <div class="ring-val"><span class="amt num" style="color:${ringColor}">${fmt(Math.abs(left))}</span>
        <span class="lbl">${left >= 0 ? "נשארו" : "חריגה"}</span></div>
      </div>
      <div class="status-main">
        <div class="status-title">${isLive ? "הסופ\"ש הנוכחי" : "הסופ\"ש האחרון"}</div>
        <div class="mut">${rangeLabel(w)}</div>
        <div class="sub num" style="margin-top:4px">${fmt(spent)} מתוך ${fmt(budget)}</div>
        <span class="badge ${spent <= budget ? "ok" : "over"}">${spent <= budget ? "✓ בתקציב" : "✗ חריגה"}</span>
      </div>
    </div>
    ${txs.length ? txs.map(txItem).join("") : `<div class="empty">עוד אין הוצאות בסופ"ש הזה</div>`}`;

  // trend chart: last weekends, oldest -> newest, ending with the current one
  const chartWins = [];
  let cw = { start: new Date(w.start), end: new Date(w.end), id: w.id };
  for (let i = 0; i < 8; i++) {
    chartWins.unshift({ start: new Date(cw.start), end: new Date(cw.end), id: cw.id });
    cw = { start: new Date(cw.start.getTime() - 7 * 864e5), end: new Date(cw.end.getTime() - 7 * 864e5) };
    cw.id = cw.start.toISOString().slice(0, 10);
  }
  let items = chartWins.map((win) => {
    const v = sum(weekendTx(win));
    return { label: `${win.start.getDate()}.${win.start.getMonth() + 1}`, value: v, over: v > budget };
  });
  const firstNZ = items.findIndex((x) => x.value > 0);
  if (firstNZ > 0) items = items.slice(firstNZ);
  $("#wk-chart").innerHTML = vbars(items, budget);

  // insights
  const hist = pastWeekends().filter((x) => x.id !== w.id);
  const withData = hist.filter((x) => x.txs.length);
  const box = $("#wk-insights");
  if (withData.length < 1) {
    box.innerHTML = `<div class="empty">אחרי כמה סופ"שים יופיעו כאן תובנות והשוואות</div>`;
  } else {
    const avg = sum(withData.map((x) => ({ amount: x.total }))) / withData.length;
    const lines = [];

    // Comparison to average
    if (spent > 0 && avg > 0) {
      const d = Math.round((spent / avg - 1) * 100);
      lines.push(d >= 10 ? ["📈", `הסופ"ש הזה יקר ב-${d}% מהממוצע שלך (${fmt(avg)})`]
        : d <= -10 ? ["📉", `הסופ"ש הזה חסכוני ב-${Math.abs(d)}% מהממוצע שלך (${fmt(avg)})`]
        : ["⚖️", `הסופ"ש הזה קרוב לממוצע שלך (${fmt(avg)})`]);
    } else lines.push(["Ø", `ממוצע סופ"ש: ${fmt(avg)} (על בסיס ${withData.length} סופ"שים)`]);

    // Overspend alert / projection for current weekend
    if (isLive && budget > 0 && txs.length > 0) {
      const daysInWk = (w.end - w.start) / (24 * 60 * 60 * 1000);
      const now = new Date();
      const daysPassed = (now - w.start) / (24 * 60 * 60 * 1000);
      const projectedEnd = spent / daysPassed * daysInWk;
      if (projectedEnd > budget * 1.15) {
        lines.push(["⚠️", `בקצב הזה תחרוג מהתקציב ב-${fmt(projectedEnd - budget)} בקרוב`]);
      }
    }

    // top category
    const catSums = {};
    [...withData.flatMap((x) => x.txs), ...txs].forEach((t) => {
      catSums[t.cat || "other"] = (catSums[t.cat || "other"] || 0) + t.amount;
    });
    const top = Object.entries(catSums).sort((a, b) => b[1] - a[1])[0];
    if (top) {
      const c = catById(top[0]);
      lines.push([c.emoji, `הכי הרבה כסף בסופ"שים הולך ל${c.name} (${fmt(top[1])} סה"כ)`]);
    }

    // Budget adherence
    const okCount = withData.filter((x) => x.total <= budget).length;
    const pct = Math.round(okCount / withData.length * 100);
    lines.push(["🎯", `עמדת בתקציב ב-${pct}% מהסופ"שים (${okCount}/${withData.length})`]);

    // Best performing weekend hint
    const bestWeekend = withData.reduce((a, b) => a.total < b.total ? a : b);
    const savings = Math.round((1 - bestWeekend.total / avg) * 100);
    if (savings > 5) {
      lines.push(["💡", `הסופ"ש הכי חסכוני שלך היה ב-${savings}% מהממוצע — אתה יכול!`]);
    }

    box.innerHTML = `<h3 style="font-size:15px;margin-bottom:4px">תובנות</h3>` +
      lines.map(([em, t]) => `<div class="insight-line"><span class="em">${em}</span><span>${t}</span></div>`).join("");
  }

  // history
  $("#wk-history").innerHTML = hist.length ? hist.map((x) => `
    <div class="card wk-card">
      <div class="wk-head">
        <span class="wk-title">${rangeLabel(x)}</span>
        <span class="num" style="font-weight:800">${fmt(x.total)}</span>
      </div>
      <div class="meter"><div style="width:${Math.min(100, budget ? x.total / budget * 100 : 0)}%;background:${x.total > budget ? "var(--crit)" : "var(--good)"}"></div></div>
      <span class="badge ${x.total <= budget ? "ok" : "over"}">${x.total <= budget ? "✓ בתקציב" : `✗ חריגה של ${fmt(x.total - budget)}`}</span>
    </div>`).join("") : `<div class="empty">עדיין אין היסטוריה</div>`;
}

function txItem(t) {
  const c = t.type === "income" ? { emoji: "💰", name: "הכנסה" } : catById(t.cat);
  const d = new Date(t.ts);
  const when = `${DAY_NAMES[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1} · ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  return `<div class="tx-item" data-tx="${t.id}">
    <span class="tx-emoji">${c.emoji}</span>
    <span class="tx-main"><div class="tx-name">${c.name}${t.note ? ` · <span class="mut">${esc(t.note)}</span>` : ""}</div>
    <div class="tx-time">${when}</div></span>
    <span class="tx-amt num ${t.type === "income" ? "in" : ""}">${t.type === "income" ? "+" : "-"}${fmt2(t.amount)}</span>
  </div>`;
}
const esc = (s) => s.replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

/* ============================= month screen ========================== */
let mYear, mMonth;
{ const n = new Date(); mYear = n.getFullYear(); mMonth = n.getMonth(); }
const MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];

function monthTx(y, m) {
  return S.tx.filter((t) => { const d = new Date(t.ts); return d.getFullYear() === y && d.getMonth() === m; });
}
function monthTotals(y, m) {
  const txs = monthTx(y, m);
  const fixedIn = S.fixed.filter((f) => f.type === "income").reduce((a, f) => a + f.amount, 0);
  const fixedOut = S.fixed.filter((f) => f.type === "expense").reduce((a, f) => a + f.amount, 0);
  const exp = txs.filter((t) => t.type === "expense");
  const reportedOut = sum(exp);                    // variable/reported expenses only
  const inc = fixedIn + sum(txs.filter((t) => t.type === "income"));
  const out = fixedOut + reportedOut;
  const byBucket = (b) => sum(exp.filter((t) => t.bucket === b));
  return { inc, out, net: inc - out, txs, fixedIn, fixedOut, reportedOut,
           weekendOut: byBucket("weekend"), baseOut: byBucket("base"), otherOut: byBucket("other") };
}
$("#m-prev").addEventListener("click", () => { mMonth--; if (mMonth < 0) { mMonth = 11; mYear--; } renderMonth(); });
$("#m-next").addEventListener("click", () => { mMonth++; if (mMonth > 11) { mMonth = 0; mYear++; } renderMonth(); });

function renderMonth() {
  $("#m-label").textContent = `${MONTHS[mMonth]} ${mYear}`;
  const m = monthTotals(mYear, mMonth);
  const rate = m.inc > 0 ? Math.round(m.net / m.inc * 100) : null;
  const cap = rate === null ? "" : m.net >= 0
    ? `<div class="cap" style="color:var(--good-text)">${rate}% נחסך</div>`
    : `<div class="cap" style="color:var(--crit)">גירעון</div>`;

  // Savings goal tracking for current month
  const isThisMonth = mYear === new Date().getFullYear() && mMonth === new Date().getMonth();
  const goal = S.settings.savingsGoal;
  const savingsKpi = goal > 0 && isThisMonth
    ? `<div class="kpi"><div class="l">מטרת חיסכון</div><div class="v num ${m.net >= goal ? "pos" : "neg"}">${fmt(m.net)}</div><div class="cap" style="color:var(--muted)">${fmt(goal)} מטרה</div></div>`
    : `<div class="kpi"><div class="l">חיסכון</div><div class="v num ${m.net >= 0 ? "pos" : "neg"}">${m.net >= 0 ? "+" : "-"}${fmt(Math.abs(m.net))}</div></div>`;

  $("#m-kpis").innerHTML = `
    <div class="kpi"><div class="l">הכנסות</div><div class="v num">${fmt(m.inc)}</div></div>
    <div class="kpi"><div class="l">הוצאות</div><div class="v num">${fmt(m.out)}</div></div>
    ${savingsKpi}`;

  // monthly budget (reported expenses) + projection for the current month
  const mb = S.settings.monthlyBudget;
  if (mb > 0) {
    const left = mb - m.reportedOut;
    const color = left < 0 ? "var(--crit)" : (Math.max(0, left) / mb) < 0.2 ? "var(--warn)" : "var(--good)";
    let proj = "";
    if (isThisMonth) {
      const dim = new Date(mYear, mMonth + 1, 0).getDate();
      const dnow = new Date().getDate();
      const projected = Math.round(m.reportedOut / dnow * dim);
      proj = `<div class="mut num" style="margin-top:6px">בקצב הזה: כ-${fmt(projected)} עד סוף החודש${projected > mb ? " ⚠️ מעל התקציב" : ""}</div>`;
    }
    $("#m-budget").innerHTML = `
      <div class="row spread"><span class="sub">🎯 תקציב חודשי (מדווחות)</span>
        <span class="num" style="font-weight:800;color:${color}">${left >= 0 ? "נשארו " + fmt(left) : "חריגה " + fmt(-left)}</span></div>
      <div class="meter" style="margin:8px 0 0"><div style="width:${Math.min(100, m.reportedOut / mb * 100)}%;background:${color}"></div></div>
      <div class="mut num" style="margin-top:4px">${fmt(m.reportedOut)} מתוך ${fmt(mb)}</div>${proj}`;
    $("#m-budget").style.display = "";
  } else {
    $("#m-budget").style.display = "none";
  }

  // where the reported money went: weekend / base / other split
  $("#m-weekend-share").innerHTML = `
    <div class="row spread"><span class="sub">🌅 סופ"שים</span><span class="num" style="font-weight:700">${fmt(m.weekendOut)}${m.reportedOut ? ` <span class="mut">(${Math.round(m.weekendOut / m.reportedOut * 100)}%)</span>` : ""}</span></div>
    <div class="row spread" style="margin-top:5px"><span class="sub">📅 בסיס (חול)</span><span class="num" style="font-weight:700">${fmt(m.baseOut)}</span></div>
    ${m.otherOut ? `<div class="row spread" style="margin-top:5px"><span class="sub">🏷️ אחר</span><span class="num" style="font-weight:700">${fmt(m.otherOut)}</span></div>` : ""}`;

  // monthly trend: reported expenses per month, last 6 months ending at viewed month
  const trend = [];
  for (let i = 5; i >= 0; i--) {
    let yy = mYear, mm = mMonth - i;
    while (mm < 0) { mm += 12; yy--; }
    trend.push({ label: `${mm + 1}/${String(yy).slice(2)}`, value: monthTotals(yy, mm).reportedOut, over: false });
  }
  $("#m-chart").innerHTML = vbars(trend, mb > 0 ? mb : 0);

  // categories
  const catSums = {};
  m.txs.filter((t) => t.type === "expense").forEach((t) => {
    catSums[t.cat || "other"] = (catSums[t.cat || "other"] || 0) + t.amount;
  });
  const entries = Object.entries(catSums).sort((a, b) => b[1] - a[1]);
  const max = entries.length ? entries[0][1] : 0;
  $("#m-cats").innerHTML = entries.length ? entries.map(([id, v]) => {
    const c = catById(id);
    return `<div class="bar-row">
      <span class="bar-label">${c.emoji} ${c.name}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${max ? v / max * 100 : 0}%;background:${catColor(id)}"></span></span>
      <span class="bar-amt num">${fmt(v)}</span></div>`;
  }).join("") : `<div class="empty">אין הוצאות מדווחות החודש</div>`;

  // fixed list
  $("#fixed-list").innerHTML = S.fixed.length ? S.fixed.map((f) => `
    <div class="tx-item" data-fixed="${f.id}">
      <span class="tx-emoji">${f.type === "income" ? "💰" : "🏠"}</span>
      <span class="tx-main"><div class="tx-name">${esc(f.name)}</div>
      <div class="tx-time">${f.type === "income" ? "הכנסה קבועה" : "הוצאה קבועה"}</div></span>
      <span class="tx-amt num ${f.type === "income" ? "in" : ""}">${f.type === "income" ? "+" : "-"}${fmt2(f.amount)}</span>
    </div>`).join("") : `<div class="empty">אין קבועות עדיין - הוסף משכורת, שכ"ד, מנויים</div>`;

  // month tx list
  const list = [...m.txs].sort((a, b) => b.ts.localeCompare(a.ts));
  $("#m-tx").innerHTML = list.length ? list.map(txItem).join("") : `<div class="empty">אין תנועות החודש</div>`;
}

document.body.addEventListener("click", (e) => {
  const txEl = e.target.closest("[data-tx]");
  if (txEl) { openTxModal(txEl.dataset.tx); return; }
  const fxEl = e.target.closest("[data-fixed]");
  if (fxEl) { openFixedModal(fxEl.dataset.fixed); return; }
});
function modal(html) { $("#modal").innerHTML = html; $("#modal-back").classList.add("show"); }
function closeModal() { $("#modal-back").classList.remove("show"); }
$("#modal-back").addEventListener("click", (e) => { if (e.target.id === "modal-back") closeModal(); });

function openTxModal(id) {
  const t = S.tx.find((x) => x.id === id); if (!t) return;
  const local = new Date(t.ts);
  const dtVal = new Date(local.getTime() - local.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  modal(`
    <h3>עריכת ${t.type === "income" ? "הכנסה" : "הוצאה"}</h3>
    <div class="field"><label>סכום (₪)</label><input type="number" id="e-amount" value="${t.amount}" min="0" step="0.01"></div>
    ${t.type === "expense" ? `<div class="field"><label>קטגוריה</label><select id="e-cat">
      ${S.categories.map((c) => `<option value="${c.id}" ${c.id === t.cat ? "selected" : ""}>${c.emoji} ${c.name}</option>`).join("")}
    </select></div>` : ""}
    <div class="field"><label>הערה</label><input id="e-note" value="${t.note ? esc(t.note) : ""}"></div>
    <div class="field"><label>תאריך ושעה</label><input type="datetime-local" id="e-ts" value="${dtVal}"></div>
    <div class="btn-row">
      <button class="btn primary" id="e-save">שמירה</button>
      <button class="btn" id="e-cancel">ביטול</button>
      <button class="btn danger" id="e-del" style="margin-inline-start:auto">מחיקה</button>
    </div>`);
  $("#e-save").onclick = () => {
    t.amount = parseFloat($("#e-amount").value) || t.amount;
    if (t.type === "expense") t.cat = $("#e-cat").value;
    t.note = $("#e-note").value.trim() || null;
    const nts = $("#e-ts").value; if (nts) t.ts = new Date(nts).toISOString();
    save(); closeModal(); render();
  };
  $("#e-del").onclick = () => { S.tx = S.tx.filter((x) => x.id !== id); save(); closeModal(); render(); };
  $("#e-cancel").onclick = closeModal;
}

function openFixedModal(id) {
  const f = id ? S.fixed.find((x) => x.id === id) : null;
  modal(`
    <h3>${f ? "עריכת קבועה" : "קבועה חדשה"}</h3>
    <div class="field"><label>סוג</label><select id="f-type">
      <option value="expense" ${f?.type !== "income" ? "selected" : ""}>הוצאה קבועה (שכ"ד, מנוי...)</option>
      <option value="income" ${f?.type === "income" ? "selected" : ""}>הכנסה קבועה (משכורת...)</option>
    </select></div>
    <div class="field"><label>שם</label><input id="f-name" value="${f ? esc(f.name) : ""}" placeholder="למשל: שכר דירה"></div>
    <div class="field"><label>סכום חודשי (₪)</label><input type="number" id="f-amount" value="${f ? f.amount : ""}" min="0"></div>
    <div class="btn-row">
      <button class="btn primary" id="f-save">שמירה</button>
      <button class="btn" id="f-cancel">ביטול</button>
      ${f ? `<button class="btn danger" id="f-del" style="margin-inline-start:auto">מחיקה</button>` : ""}
    </div>`);
  $("#f-save").onclick = () => {
    const name = $("#f-name").value.trim();
    const amount = parseFloat($("#f-amount").value);
    if (!name || !amount) return;
    if (f) { f.name = name; f.amount = amount; f.type = $("#f-type").value; }
    else S.fixed.push({ id: uid(), type: $("#f-type").value, name, amount });
    save(); closeModal(); render();
  };
  if (f) $("#f-del").onclick = () => { S.fixed = S.fixed.filter((x) => x.id !== id); save(); closeModal(); render(); };
  $("#f-cancel").onclick = closeModal;
}
$("#fixed-add").addEventListener("click", () => openFixedModal(null));

["set-budget", "set-monthly", "set-savings-goal", "set-start-day", "set-start-hour", "set-end-day", "set-end-hour"].forEach((id) => {

/* -------- backup / export -------- */
function download(filename, text, mime) {
  const doIt = async () => {
    if (window.claude?.downloads) {
      try { await window.claude.downloads.save({ filename, data: text }); return; } catch {}
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: mime }));
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  doIt();
}
$("#backup-export").addEventListener("click", () => {
  download(`kesef-backup-${new Date().toISOString().slice(0, 10)}.json`,
    JSON.stringify(S, null, 2), "application/json");
});
$("#backup-import").addEventListener("click", () => $("#import-file").click());
$("#import-file").addEventListener("change", (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data.tx || !data.settings) throw new Error("bad file");
      S = { ...DEFAULTS(), ...data, settings: { ...DEFAULTS().settings, ...data.settings } };
      save(); render(); showToast("הגיבוי יובא בהצלחה ✓", false);
    } catch { showToast("קובץ לא תקין", false); }
  };
  r.readAsText(f);
  e.target.value = "";
});
$("#csv-export").addEventListener("click", () => {
  const rows = [["date", "time", "type", "category", "amount", "note", "weekend"]];
  [...S.tx].sort((a, b) => a.ts.localeCompare(b.ts)).forEach((t) => {
    const d = new Date(t.ts);
    rows.push([d.toISOString().slice(0, 10), d.toTimeString().slice(0, 5), t.type,
      t.type === "expense" ? catById(t.cat).name : "",
      t.amount, t.note || "", inWeekend(t.ts) ? "yes" : "no"]);
  });
  const csv = "﻿" + rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
  download("kesef-data.csv", csv, "text/csv;charset=utf-8");
});
$("#wipe").addEventListener("click", () => {
  modal(`
    <h3>למחוק את כל הנתונים?</h3>
    <p class="sub">הפעולה בלתי הפיכה. מומלץ לייצא גיבוי קודם.</p>
    <div class="btn-row">
      <button class="btn danger" id="w-yes">כן, מחק הכל</button>
      <button class="btn primary" id="w-no">ביטול</button>
    </div>`);
  $("#w-yes").onclick = () => { S = DEFAULTS(); save(); closeModal(); render(); };
  $("#w-no").onclick = closeModal;
});
